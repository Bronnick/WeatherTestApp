<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title">5-day forecast</h2>

    <div class="grid grid-cols-5 gap-2">
      @for (day of days(); track day.date) {
        <div class="flex flex-col items-center gap-1 rounded-box bg-base-200 p-2 text-center" [title]="day.description">
          <span class="font-semibold">{{ day.day }}</span>
          <span class="text-xs text-base-content/60">{{ day.date }}</span>
          <div class="size-10 text-primary">
            <app-weather-icon [condition]="day.condition" />
          </div>
          <span class="font-semibold">{{ day.tempMax }}&deg;</span>
          <span class="text-sm text-base-content/60">{{ day.tempMin }}&deg;</span>
        </div>
      }
    </div>
  </div>
</div>
