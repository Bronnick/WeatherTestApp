<div class="flex flex-col gap-6">
  <h1 class="text-3xl font-bold text-center">Weather Forecast</h1>

  <form (ngSubmit)="getWeather()" class="flex gap-3">
    <input [(ngModel)]="city" type="text" name="city" class="input w-full" placeholder="Enter city name" />
    <button type="submit" class="btn btn-primary" [disabled]="loading() || !city.trim()">
      @if (loading()) {
        <span class="loading loading-spinner loading-sm"></span>
      }
      Get forecast
    </button>
  </form>

  @if (error(); as error) {
    <div role="alert" class="alert alert-error">{{error }}</div>
  }

  @if (weather(); as weather) {
    <app-weather-card [weather]="weather" />
  }
</div>
